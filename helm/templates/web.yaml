apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "journal.fullname" . }}-web
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "journal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "journal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AUTH_URL
              value: {{ .Values.web.authUrl | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
          # envFrom rather than named keys, so adding a provider is a secret
          # edit and not a chart edit.
          envFrom:
            - secretRef:
                name: {{ .Values.auth.existingSecret }}
          # / answers as soon as the server is listening, which is all we check
          # for now. Replace with a real health endpoint when there is one.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "journal.fullname" . }}-web
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "journal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
