{{/*
  Secrets the chart renders from values.

  Values reach `helm get values`, the release object in the cluster, and whatever
  shell history put them there — so pass them from a file or an environment
  variable at install time rather than committing them, and set
  `existingSecret` on either block to hand the chart a secret you made yourself
  instead. Naming one skips its template entirely.
*/}}
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "journal.postgresSecretName" . }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The whole connection string, password included: the agent's database
  # connector takes one DSN, and splitting it here would only mean reassembling
  # it there.
  {{ .Values.postgres.secretKey }}: {{ required "postgres.url is required unless postgres.existingSecret names one" .Values.postgres.url | quote }}
{{- end }}
{{- if not .Values.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "journal.authSecretName" . }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Mounted with envFrom, so the keys are the environment variable names the web
  # app reads. Adding a provider is a value, not a chart edit.
  AUTH_SECRET: {{ required "auth.secret is required unless auth.existingSecret names one" .Values.auth.secret | quote }}
  AUTH_OIDC_ID: {{ required "auth.oidcId is required unless auth.existingSecret names one" .Values.auth.oidcId | quote }}
  AUTH_OIDC_SECRET: {{ required "auth.oidcSecret is required unless auth.existingSecret names one" .Values.auth.oidcSecret | quote }}
{{- end }}
