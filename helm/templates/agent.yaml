apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "journal.fullname" . }}-agent
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      {{- include "journal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "journal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.agent.port }}
          env:
            - name: HTTP_PORT
              value: {{ .Values.agent.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
          volumeMounts:
            - name: flows
              mountPath: /etc/octo/integrations
              readOnly: true
          # The image runs as nonroot on a distroless base and writes nothing,
          # so it needs no volume and no write access.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 2
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: flows
          configMap:
            name: {{ .Values.agent.flowsConfigMap }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "journal.fullname" . }}-agent
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  ports:
    - name: http
      port: {{ .Values.agent.service.port }}
      targetPort: http
  selector:
    {{- include "journal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
