{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "journal.fullname" . }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the web app is exposed; the editor has no auth of its own and
          # stays cluster-internal. Reach it with `kubectl port-forward`.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "journal.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
