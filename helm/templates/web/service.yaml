apiVersion: v1
kind: Service
metadata:
  name: {{ include "journal.fullname" . }}-web
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "journal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
