# Deliberately thin: two deployments, an HTTPRoute, and a Postgres that lives
# outside the cluster. HPA, PDB, network policy and resource tuning are absent on
# purpose and get added when we want them.

nameOverride: ""
fullnameOverride: ""

image:
  pullPolicy: IfNotPresent

web:
  replicaCount: 1
  image:
    repository: ghcr.io/eetr-ai/journal-web
    # Empty falls back to the chart's appVersion. Set it to pin a build.
    tag: ""
  service:
    port: 3000
  # Must be the URL the browser uses: OIDC callback URLs are built from it, and
  # the issuer compares what it gets against what is registered.
  authUrl: http://journal.local
  resources: {}

agent:
  replicaCount: 1
  image:
    # The stock octo runtime. It carries the binary and nothing else; the flows
    # arrive from a ConfigMap. Not octo-runtime-paas, which expects an
    # orchestrator, and not juancavallotti/octo, which is the visual editor.
    repository: juancavallotti/octo-runtime
    # Pin this to an octo release once we care which runtime we are on.
    tag: latest
  # The port the flows' http connector binds, passed through as HTTP_PORT.
  port: 8080
  # Where the runtime serves /healthz and /readyz. Its own default.
  adminPort: 39999
  # The ConfigMap holding the flow YAML, mounted at /etc/octo/integrations where
  # the runtime looks for it. Built from agent/flows by `task helm:flows`, and
  # kept outside the chart so the flows have one home in the repo.
  flowsConfigMap: journal-flows
  service:
    port: 8080
  # The agent trusts its caller, so the only thing keeping it to the BFF is this.
  # Turn it off only for a cluster whose CNI does not enforce policy, where it
  # would be a promise nothing keeps.
  networkPolicy:
    enabled: true
  resources: {}

postgres:
  # The database is not in this chart and not in this cluster. A DSN is all the
  # agent needs, and splitting it into parts here would only mean reassembling
  # it there.
  #
  # The Secret is created before the release, by whoever holds the credential.
  # The chart reads it and never writes one, because anything passed as a value
  # ends up in `helm get values` and in the release object.
  #
  #   kubectl create secret generic journal-postgres \
  #     --from-literal=url='postgres://journal:...@postgres.internal:5432/journal'
  existingSecret: journal-postgres
  secretKey: url

auth:
  # Holds AUTH_SECRET and the AUTH_OIDC_* pair, mounted with envFrom so its keys
  # are the environment variable names the web app reads. Same reasoning as
  # above: created before the release, never by it.
  #
  #   kubectl create secret generic journal-auth \
  #     --from-literal=AUTH_SECRET=... \
  #     --from-literal=AUTH_OIDC_ID=... \
  #     --from-literal=AUTH_OIDC_SECRET=...
  existingSecret: journal-auth

# Gateway API rather than Ingress. The chart brings the route; the Gateway itself
# belongs to the cluster, so it is referenced and never created here.
gateway:
  enabled: true
  parentRef:
    name: ""
    namespace: ""
    # The listener on that Gateway, when it has more than one.
    sectionName: ""
  hostnames:
    - journal.local
