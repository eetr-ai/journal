# Deliberately thin: two deployments, an HTTPRoute, and a Postgres that lives
# outside the cluster. HPA, PDB, network policy and resource tuning are absent on
# purpose and get added when we want them.

nameOverride: ""
fullnameOverride: ""

image:
  pullPolicy: IfNotPresent

web:
  replicaCount: 1
  image:
    repository: ghcr.io/eetr-ai/journal-web
    # Empty falls back to the chart's appVersion. Set it to pin a build.
    tag: ""
  service:
    port: 3000
  # Must be the URL the browser uses: OIDC callback URLs are built from it, and
  # the issuer compares what it gets against what is registered.
  authUrl: http://journal.local
  resources: {}

agent:
  replicaCount: 1
  image:
    # The octo runtime with our flows baked in, built from agent/Dockerfile. The
    # runtime version it is based on is pinned there.
    repository: ghcr.io/eetr-ai/journal-agent
    # Empty falls back to the chart's appVersion. Set it to pin a build.
    tag: ""
  # The port the flows' http connector binds, passed through as HTTP_PORT.
  port: 8080
  # Where the runtime serves /healthz and /readyz. Its own default.
  adminPort: 39999
  service:
    port: 8080
  # The agent trusts its caller, so the only thing keeping it to the BFF is this.
  # Turn it off only for a cluster whose CNI does not enforce policy, where it
  # would be a promise nothing keeps.
  networkPolicy:
    enabled: true
  resources: {}

# The schema, applied as a hook before the pods on every install and upgrade.
# Every statement in it is idempotent, so this is a no-op against a database
# that is already current.
migration:
  enabled: true
  image:
    # Postgres with the schema in it, built from sql/Dockerfile. Stock psql and
    # our own SQL, so the migration needs nothing mounted beside it.
    repository: ghcr.io/eetr-ai/journal-migrate
    # Empty falls back to the chart's appVersion. Set it to pin a build.
    tag: ""
  # A migration that fails twice more will not succeed on the fourth try; fail
  # the release instead and say so.
  backoffLimit: 2
  resources: {}

postgres:
  # The database is not in this chart and not in this cluster. Only the
  # credential is secret — where the server is, is not — so the Secret holds two
  # keys and the rest of the DSN is values you can read in a code review.
  #
  # The Secret is created before the release, by whoever holds the credential.
  # The chart reads it and never writes one, because anything passed as a value
  # ends up in `helm get values` and in the release object.
  #
  #   kubectl create secret generic journal-db \
  #     --from-literal=username=journal --from-literal=password='...'
  existingSecret: journal-db
  usernameKey: username
  passwordKey: password
  # No default: a wrong host is a connection error, a defaulted one is a
  # connection to something you did not mean.
  host: ""
  port: 5432
  database: journal
  # `require` encrypts and verifies nothing: it accepts any certificate, so it
  # stops a passive listener and not the attacker who can answer as the server.
  # `verify-full` is the one that authenticates the host, and it needs the chain
  # to resolve in the image's trust store — the chart mounts no CA bundle yet,
  # so a private CA means `disable` and a network you are treating as the
  # boundary, deliberately.
  sslmode: verify-full

auth:
  # Holds AUTH_SECRET and the AUTH_OIDC_* pair, mounted with envFrom so its keys
  # are the environment variable names the web app reads. Same reasoning as
  # above: created before the release, never by it.
  #
  #   kubectl create secret generic journal-auth \
  #     --from-literal=AUTH_SECRET=... \
  #     --from-literal=AUTH_OIDC_ID=... \
  #     --from-literal=AUTH_OIDC_SECRET=...
  existingSecret: journal-auth

# Gateway API rather than Ingress. The chart brings the route; the Gateway itself
# belongs to the cluster, so it is referenced and never created here.
gateway:
  enabled: true
  parentRef:
    name: ""
    namespace: ""
    # The listener on that Gateway, when it has more than one.
    sectionName: ""
  hostnames:
    - journal.local
