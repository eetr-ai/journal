# Overrides for the local k3d cluster. Nothing secret is in here: the database
# URL and the auth credentials are assembled from .env at install time by
# `task deploy`, so this file stays committable.
#
# The database is genuinely outside the cluster — it is the compose Postgres on
# your host, which k3d reaches at host.k3d.internal.
#
# The image is built and imported rather than pulled — nothing has been published
# to ghcr yet, and a local build is what we are testing.
web:
  image:
    repository: journal-web
    tag: local
  # The origin the browser uses. The OIDC client registered at auth.eetr.app must
  # list {this}/api/auth/callback/eetr as a redirect URI, or sign-in stops at the
  # issuer.
  authUrl: http://journal.localhost

image:
  # The image only exists in the cluster's own store.
  pullPolicy: IfNotPresent

gateway:
  parentRef:
    name: local-gateway
    namespace: kube-system
  hostnames:
    - journal.localhost
