name: release

# Everything we publish is an OCI artifact in this repo's GitHub Container
# Registry: the web image, and the Helm chart alongside it. One registry, one
# set of credentials, one place to look.
#
# Called by release-please rather than triggered by the tag it pushes: a push
# made with GITHUB_TOKEN fires no workflow, so `on: push: tags` here would never
# run. Dispatch it by hand to publish a tag that missed its chance.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag to publish, as `v0.0.0`.
        type: string
        required: true
    secrets:
      EETR_API_KEY:
        description: Bearer token for the eetr deployment API.
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to publish, as `v0.0.0`.
        type: string
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  web-image:
    name: web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          # v0.0.1 -> tags 0.0.1 and latest. The chart's appVersion is the bare
          # version, so the semver tag is the one that has to match.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          # amd64 only: that is what we deploy to.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent-image:
    name: agent image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-agent
          # Versioned with the release, not with the octo runtime underneath
          # it: what changes between these tags is our flows.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          # amd64 only: that is what we deploy to.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-image:
    name: migrate image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-migrate
          # Versioned with the release: the chart's appVersion is what the
          # migration Job asks for.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./sql
          # amd64 only: that is what we deploy to.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  platform-image:
    name: platform image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-platform
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          # The repo root: the sidecar carries the integration's resources as
          # well as its own binary.
          context: .
          file: platform/Dockerfile
          # amd64 only: that is what we deploy to.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@v4

      # Helm speaks OCI natively, so the registry login is the same one docker
      # just used and the push is a plain `helm push`. No chart repo, no
      # index.yaml, no GitHub Pages branch to keep alive.
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          helm package helm --destination dist
          # Lands at oci://ghcr.io/<owner>/charts/journal, tagged with the
          # chart version release-please just wrote into Chart.yaml.
          helm push dist/journal-*.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  deploy:
    name: deploy
    # Last, and only if everything it would deploy actually got published: the
    # CI pulls the chart by version, and a version that is not in the registry
    # is a rollout that never becomes ready.
    needs: [web-image, agent-image, migrate-image, platform-image, chart]
    runs-on: ubuntu-latest
    # Nothing here touches the repo or the registry; it is one call to an
    # external API.
    permissions: {}
    steps:
      - name: Tell eetr the new chart version
        env:
          EETR_API_KEY: ${{ secrets.EETR_API_KEY }}
          # The chart is versioned as `0.0.0`, the tag as `v0.0.0`.
          CHART_VERSION: ${{ inputs.ref }}
        run: |
          if [ -z "$EETR_API_KEY" ]; then
            echo "::error::EETR_API_KEY is not set; nothing was deployed." >&2
            exit 1
          fi
          curl -sS --fail-with-body -X PATCH \
            "https://eetr01.eetr.app/api/v1/charts/070a9a71-d752-4b58-a16a-854facd44404" \
            -H "Authorization: Bearer $EETR_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"chartVersion":"%s"}' "${CHART_VERSION#v}")"
