name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Required to be present at build time; never used. The real value lives
      # in the cluster secret.
      - run: npm run build
        env:
          AUTH_SECRET: build-only-not-a-real-secret

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint helm -f helm/ci/values.yaml
      # The chart refuses to render without its secrets, so CI supplies
      # throwaway ones.
      - run: helm template journal helm -f helm/ci/values.yaml

  agent:
    name: agent
    runs-on: ubuntu-latest
    # The flow suites exercise the real statements against a real Postgres. A
    # mocked sql block would only assert the mock.
    services:
      postgres:
        # pgvector rather than stock Postgres: the schema the suites run against
        # declares a vector column, so the extension has to exist.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journal"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # dolphin drives a real octo per case, so both binaries have to be here.
      - run: go install github.com/juancavallotti/octo/runtime/octo@latest
      - run: go install github.com/juancavallotti/octo/runtime/dolphin@latest

      - name: Apply the schema and the fixtures
        run: |
          psql -v ON_ERROR_STOP=1 -f deploy/local/postgres-extensions.sql
          for f in sql/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f agent/testdata/seed.sql
        env:
          PGHOST: localhost
          PGUSER: journal
          PGPASSWORD: journal
          PGDATABASE: journal

      # Runs each *_test.yaml against the whole flows directory, so a flow that
      # no longer parses or no longer returns what it promised fails the job.
      #
      # The model keys are declared required, so the runtime will not start
      # without them — which is what we want in a cluster and what needs a
      # placeholder here. No case calls a model; one that did would fail loudly
      # rather than quietly billing us.
      - run: dolphin test ./agent/flows --junit dolphin-report.xml
        env:
          OPENROUTER_API_KEY: ci-not-a-real-key
          PARALLEL_API_KEY: ci-not-a-real-key

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-report
          path: dolphin-report.xml

  platform:
    name: platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    # The sidecar's tests exercise the real statements and the real Redis
    # primitives. The interesting properties here — a long poll that waits, a
    # pending list that redelivers — are the backing store's behaviour, and a
    # fake would only assert the fake.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journal"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: platform/go.sum

      - name: Apply the schema
        working-directory: .
        run: |
          psql -v ON_ERROR_STOP=1 -f deploy/local/postgres-extensions.sql
          for f in sql/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
        env:
          PGHOST: localhost
          PGUSER: journal
          PGPASSWORD: journal
          PGDATABASE: journal

      - run: go vet ./...
      - run: go test ./... -count=1
        env:
          TEST_POSTGRES_DSN: postgres://journal:journal@localhost:5432/journal?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
