name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Required to be present at build time; never used. The real value lives
      # in the cluster secret.
      - run: npm run build
        env:
          AUTH_SECRET: build-only-not-a-real-secret

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint helm
      - run: helm template journal helm

  agent:
    name: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # dolphin drives a real octo per case, so both binaries have to be here.
      - run: go install github.com/juancavallotti/octo/runtime/octo@latest
      - run: go install github.com/juancavallotti/octo/runtime/dolphin@latest
      # Runs each *_test.yaml against the whole flows directory, so a flow that
      # no longer parses or no longer returns what it promised fails the job.
      - run: dolphin test ./agent/flows --junit dolphin-report.xml

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-report
          path: dolphin-report.xml
