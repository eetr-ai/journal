name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Required to be present at build time; never used. The real value lives
      # in the cluster secret.
      - run: npm run build
        env:
          AUTH_SECRET: build-only-not-a-real-secret

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint helm -f helm/ci/values.yaml
      # The chart refuses to render without its secrets, so CI supplies
      # throwaway ones.
      - run: helm template journal helm -f helm/ci/values.yaml

  agent:
    name: agent
    runs-on: ubuntu-latest
    # The flow suites exercise the real statements against a real Postgres. A
    # mocked sql block would only assert the mock.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journal"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # dolphin drives a real octo per case, so both binaries have to be here.
      - run: go install github.com/juancavallotti/octo/runtime/octo@latest
      - run: go install github.com/juancavallotti/octo/runtime/dolphin@latest

      - name: Apply the schema and the fixtures
        run: |
          for f in helm/files/sql/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f agent/testdata/seed.sql
        env:
          PGHOST: localhost
          PGUSER: journal
          PGPASSWORD: journal
          PGDATABASE: journal

      # Runs each *_test.yaml against the whole flows directory, so a flow that
      # no longer parses or no longer returns what it promised fails the job.
      - run: dolphin test ./agent/flows --junit dolphin-report.xml

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-report
          path: dolphin-report.xml
