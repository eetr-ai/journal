name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The build needs these two present but does not care what they are: the
      # page renders the signed-out branch either way. Real values live in the
      # cluster secret, never here.
      - run: npm run build
        env:
          AUTH_SECRET: build-only-not-a-real-secret
          DATABASE_URL: postgres://journal:journal@localhost:5432/journal

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint helm
      - run: helm template journal helm

  agent:
    name: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # No build step for YAML flows, so the check that matters is that the
      # runtime loads them: invoke parses the whole config before running.
      - run: go install github.com/juancavallotti/octo/runtime/octo@latest
      - run: octo invoke --config ./agent/flows --flow hello --data '{}' --envelope
