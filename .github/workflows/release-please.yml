name: release-please

# Runs on every push to main: opens (or updates) the release PR, and when that
# PR merges, cuts the tag and the GitHub release.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Manifest mode names its outputs after the package path; the bare names
    # exist too while there is only one package. Read both, take whichever.
    outputs:
      released: ${{ steps.release.outputs.release_created || steps.release.outputs['.--release_created'] }}
      tag: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Same run rather than a second workflow on the tag: the tag is pushed with
  # GITHUB_TOKEN, and a push made with that token starts nothing.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    # A called workflow gets no secrets unless they are handed to it, and the
    # deploy job needs the eetr key.
    secrets: inherit
    with:
      ref: ${{ needs.release-please.outputs.tag }}
