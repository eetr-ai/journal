version: '3'

# The journal monorepo. Module taskfiles are imported under a namespace, so
# `task web:build` and `task agent:dev` work from anywhere in the tree.

# Exported into the environment of every command below, so no module has to own
# the file. Start from .env.example; a missing .env is not an error to Task.
dotenv: ['.env']

includes:
  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web
  agent:
    taskfile: ./agent/Taskfile.yml
    dir: ./agent
  platform:
    taskfile: ./platform/Taskfile.yml
    dir: ./platform

vars:
  # Spelled out rather than interpolated: compose owns these credentials, and
  # this is the one place they are duplicated.
  PSQL: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U journal -d journal
  # The local cluster the deploy tasks below talk to.
  K3D_CLUSTER: journal-dev
  NAMESPACE: journal
  WEB_IMAGE: journal-web:local
  AGENT_IMAGE: journal-agent:local
  PLATFORM_IMAGE: journal-platform:local
  MIGRATE_IMAGE: journal-migrate:local
  # The compose Redis on your host, as the cluster reaches it — the same shape
  # as the database, which is also genuinely outside the cluster.
  CLUSTER_REDIS_URL: redis://host.k3d.internal:6379/0

tasks:
  default:
    desc: Show the available tasks
    cmds:
      - task --list

  install:
    desc: Install every module's dependencies
    cmds:
      - npm install
      - task: web:install
      - task: agent:install

  dev:
    desc: Bring up the dependencies, then run the web app, the agent and its sidecar
    deps:
      - db:up
    cmds:
      # concurrently over backgrounding: one Ctrl-C takes all three down, and
      # every output line says which side produced it. The sidecar is first
      # because the runtime discovers it at startup — it retries for thirty
      # seconds, so losing the race is survivable rather than fatal.
      - >-
        npx concurrently
        --kill-others
        --prefix "[{name}]"
        --names "platform,web,agent"
        --prefix-colors "yellow,cyan,magenta"
        "task platform:run"
        "task web:dev"
        "task agent:dev"

  db:up:
    desc: Start Postgres and Redis and wait for them to accept connections
    cmds:
      # --wait blocks on the healthchecks, so the first query after this lands.
      # Redis is here rather than in a task of its own because nothing in this
      # repo wants one without the other.
      - docker compose up -d --wait postgres redis

  db:down:
    desc: Stop Postgres, keeping the data volume
    cmds:
      - docker compose down

  db:reset:
    desc: Destroy the local Postgres data directory and rebuild it from sql/
    prompt: This drops the journal database and everything in it. Continue?
    cmds:
      - docker compose down
      # The data is a bind mount now, so `down -v` does not touch it.
      - rm -rf data/postgres
      - task: db:up

  db:migrate:
    desc: Re-apply sql/ against the running Postgres
    deps:
      - db:up
    cmds:
      # Idempotent, so it is safe to re-run. Once the volume exists, this is the
      # only way a schema edit reaches the database.
      - for f in sql/*.sql; do echo "applying $f..."; {{.PSQL}} -f "/docker-entrypoint-initdb.d/$(basename $f)"; done

  db:seed:
    desc: Load the flow suites' fixture rows
    deps:
      - db:up
    cmds:
      # Piped rather than -f: this one lives outside the directory compose mounts
      # into the container.
      - '{{.PSQL}} -q < agent/testdata/seed.sql'

  db:psql:
    desc: Open a psql shell against the running Postgres
    cmds:
      - docker compose exec postgres psql -U journal -d journal

  lint:
    desc: Lint every module
    cmds:
      - task: web:lint

  format:
    desc: Format every module
    cmds:
      - task: web:format

  format:check:
    desc: Check formatting across every module
    cmds:
      - task: web:format:check

  test:
    desc: Run every module's tests
    deps:
      - db:up
    cmds:
      # The flow suites talk to a real Postgres, so the schema and the fixtures
      # have to be in it first.
      - task: db:migrate
      - task: db:seed
      - task: agent:test
      - task: platform:test

  build:
    desc: Build every module
    cmds:
      - task: web:build

  helm:lint:
    desc: Lint the Helm chart
    cmds:
      # The chart refuses to render without its secrets, which is the point, so
      # linting supplies throwaway ones.
      - helm lint helm -f helm/ci/values.yaml

  helm:template:
    desc: Render the Helm chart to stdout
    cmds:
      - helm template journal helm -f helm/ci/values.yaml

  cluster:gateway:
    desc: Enable Traefik's Gateway API provider on the local cluster
    cmds:
      # k3s ships the CRDs and Traefik but not the provider that joins them, so
      # without this an HTTPRoute has nothing to attach to.
      - kubectl apply -f deploy/local/traefik-gateway.yaml

  image:web:
    desc: Build the web image for the local cluster
    cmds:
      - docker build -t {{.WEB_IMAGE}} web

  image:agent:
    desc: Build the agent image — the octo runtime with our flows in it
    cmds:
      - docker build -t {{.AGENT_IMAGE}} agent

  image:migrate:
    desc: Build the migration image — the schema with a psql to apply it
    cmds:
      - docker build -t {{.MIGRATE_IMAGE}} sql

  image:platform:
    desc: Build the platform sidecar image — octo's platform API, on our own infrastructure
    cmds:
      - docker build -t {{.PLATFORM_IMAGE}} platform

  cluster:import:
    desc: Push the locally built images into the k3d cluster
    deps:
      - image:web
      - image:agent
      - image:migrate
      - image:platform
    cmds:
      # A local build is what we are testing, and the cluster has no credentials
      # for ghcr.
      - k3d image import {{.WEB_IMAGE}} {{.AGENT_IMAGE}} {{.MIGRATE_IMAGE}} {{.PLATFORM_IMAGE}} -c {{.K3D_CLUSTER}}

  cluster:namespace:
    desc: Create the namespace the release lives in
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -

  cluster:secrets:
    desc: Create the Secrets the chart reads, from .env
    deps:
      - cluster:namespace
    cmds:
      # Applied straight to the cluster rather than passed to Helm: a credential
      # given as a value is readable afterwards through `helm get values` and in
      # the release object. These exist before the release and outlive it.
      - >-
        kubectl create secret generic journal-db -n {{.NAMESPACE}}
        --from-literal=username="$POSTGRES_USER"
        --from-literal=password="$POSTGRES_PASSWORD"
        --dry-run=client -o yaml | kubectl apply -f -
      - >-
        kubectl create secret generic journal-auth -n {{.NAMESPACE}}
        --from-literal=AUTH_SECRET="$AUTH_SECRET"
        --from-literal=AUTH_OIDC_ID="$AUTH_OIDC_ID"
        --from-literal=AUTH_OIDC_SECRET="$AUTH_OIDC_SECRET"
        --dry-run=client -o yaml | kubectl apply -f -
      # The Redis is the compose one on your host, reached the same way the
      # database is. A missing SECRETS_KEY is not fatal — the sidecar says so on
      # startup and stores octo's own secrets in the clear.
      - >-
        kubectl create secret generic journal-platform -n {{.NAMESPACE}}
        --from-literal=REDIS_URL="{{.CLUSTER_REDIS_URL}}"
        --from-literal=SECRETS_KEY="$SECRETS_KEY"
        --dry-run=client -o yaml | kubectl apply -f -
      - >-
        kubectl create secret generic journal-models -n {{.NAMESPACE}}
        --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
        --from-literal=PARALLEL_API_KEY="$PARALLEL_API_KEY"
        --dry-run=client -o yaml | kubectl apply -f -

  deploy:
    desc: Install or upgrade the chart on the local cluster
    deps:
      - cluster:import
      - cluster:secrets
    cmds:
      - >-
        helm upgrade --install journal helm
        --namespace {{.NAMESPACE}}
        -f helm/values-local.yaml
        --wait

  cluster:proxy:
    desc: Publish the cluster's Gateway on localhost:3000
    cmds:
      # Through Traefik rather than straight at the web Service, so what the
      # browser exercises is the HTTPRoute and not a tunnel past it. Port 3000
      # because that is the origin the issuer already knows.
      - kubectl port-forward -n kube-system svc/traefik 3000:80

  undeploy:
    desc: Remove the release from the local cluster
    cmds:
      - helm uninstall journal --namespace {{.NAMESPACE}}
