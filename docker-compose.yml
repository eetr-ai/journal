# Local dependencies only. The apps run on the host, not in here, so their hot
# reload is not fighting a bind mount.
services:
  postgres:
    # pgvector rather than stock Postgres, because the agent's memory is
    # searched by meaning. The extension has to exist before 002 can create it.
    image: pgvector/pgvector:pg17
    container_name: journal-postgres
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journal
    ports:
      - '5432:5432'
    volumes:
      # A directory in the repo rather than a named volume: it survives
      # `docker compose down -v`, it can be inspected and backed up with the
      # tools you already have, and it is obvious where the data went. Gitignored.
      - ./data/postgres:/var/lib/postgresql/data
      # Postgres runs these on first boot only, against an empty data
      # directory. An existing volume ignores any later edit to them.
      - ./sql:/docker-entrypoint-initdb.d:ro
    # `--wait` blocks on this, so a caller can assume the first query lands.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U journal -d journal']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Leases, leader election, and the queues and topics octo reaches through
    # the platform sidecar. Nothing durable lives here.
    image: redis:8-alpine
    container_name: journal-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
