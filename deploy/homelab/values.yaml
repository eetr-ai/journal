# Everything else is the chart's default, which is already pointed at this
# cluster's Redis — `redis.platform-system.svc.cluster.local`, database 1.
#
# Five Secrets, none of them created by the chart: journal-db (username,
# password), journal-auth (AUTH_SECRET, AUTH_OIDC_ID, AUTH_OIDC_SECRET),
# journal-platform (SECRETS_KEY), journal-models (OPENROUTER_API_KEY,
# PARALLEL_API_KEY), and journal-redis (password, copied from
# platform-system/redis-password — a Secret cannot be read across a namespace).
#
# The namespace also has to carry `home-lab.example/redis-access: "true"`, which
# is what that Redis's NetworkPolicy admits. It already does.
#
# The database needs the pgvector extension available — the agent's memory is
# searched by meaning — and the migration creates it.

postgres:
  host: eetr01
  # The home lab's Postgres does not serve TLS at all, so there is nothing to
  # verify and `require` would only fail to connect. The network between the
  # cluster and eetr01 is the boundary here, by choice and not by accident.
  sslmode: disable

web:
  authUrl: https://journal.inflightproject.com

gateway:
  parentRef:
    # The Gateway to attach to. It belongs to whoever runs the cluster, so the
    # chart references one and never creates it — and refuses to render until
    # this names it.
    name: home-lab
    # Named because that Gateway is not in this namespace. Leave it out entirely
    # when it is; an empty one is omitted, not sent as empty.
    namespace: platform-system
  hostnames:
    - journal.inflightproject.com
