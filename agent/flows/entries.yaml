# The journal entries: what the agent writes down while a person talks.
#
#   GET    /entries/{subject}       the most recent, newest first
#   GET    /entries/{subject}/days  the days with something on them
#   GET    /entries/{subject}/{id}  one entry
#   DELETE /entries/{subject}/{id}  throw one away
#   POST   /entries/{subject}/search  find one by what it was about
#
# and, below the routes, the sourceless flows behind the agent's tools. They are
# flows rather than inline tool chains so that each one is a unit dolphin can
# run: chat.yaml cannot be tested, and everything the agent does to a person's
# journal would otherwise be untestable with it.
#
# What a tool is told:
#   vars.subject   whose journal this is, from the path — the whole access check
#   vars.dataKey   the key this run seals under, base64, kept nowhere
#   vars.threadId  the conversation, which is what a running note is keyed on
#   vars.today     the reader's date, because the server's day is not theirs
#   vars.entryId   the entry the reader has open, empty when they are on today's
#
# All four are lifted into vars by chat.yaml before the agent starts: a tool's
# body is the model's arguments, so the request that carried them is gone by the
# time one runs.
#
# Rows leave the routes sealed. The browser holds the key and opens them; the
# tools open them here, because the model has to read what it is adding to.
flows:
  # The most recent, newest first, or one day of them.
  #
  # The cap stays whatever the filter is: this is the drawer's query, and a
  # drawer shows the recent ones. A reader who wants further back names a day.
  - name: entries
    source:
      connector: api
      type: http
      settings:
        path: /entries/{subject}
        methods: [GET]
    process:
      # A route always carries a query map; a flow invoked by name in a test
      # does not. Defaulted here so the arguments below read as filters rather
      # than as three copies of the same guard.
      - type: set-variable
        name: hold-filters
        settings:
          name: filters
          value: 'has(vars.query) ? vars.query : {}'
      - type: sql
        name: select-entries
        settings:
          connector: db
          query: |
            SELECT id, thread_key, entry_date, title, content, bookmarked, created_at, updated_at
            FROM journal_entry
            WHERE oidc_subject = $1
              AND ($2 = '' OR entry_date = $2::date)
              AND ($3 = '' OR entry_date >= $3::date)
              AND ($4 = '' OR entry_date <= $4::date)
            ORDER BY entry_date DESC, created_at DESC
            LIMIT 200
          args:
            - vars.subject
            - 'has(vars.filters.date) ? vars.filters.date : ""'
            - 'has(vars.filters.from) ? vars.filters.from : ""'
            - 'has(vars.filters.to) ? vars.filters.to : ""'
      # A person with nothing written is an ordinary answer, not a 404.
      - type: set-payload
        name: wrap
        settings:
          value: '{"entries": body}'

  - name: entry
    source:
      connector: api
      type: http
      settings:
        path: /entries/{subject}/{id}
        methods: [GET, DELETE]
    process:
      - type: switch
        name: route
        cases:
          - when: 'vars.method == "GET"'
            process:
              - type: sql
                name: select-entry
                settings:
                  connector: db
                  query: |
                    SELECT id, thread_key, entry_date, title, content, bookmarked, created_at, updated_at
                    FROM journal_entry
                    WHERE oidc_subject = $1 AND id = $2::uuid
                  args:
                    - vars.subject
                    - vars.id
                  single: true
              - type: if
                name: check-found
                condition: 'body == null'
                then:
                  process:
                    - type: set-variable
                      settings: { name: httpStatus, value: "404" }
                    - type: set-payload
                      settings:
                        value: '{"error": "entry not found"}'

          - when: 'vars.method == "DELETE"'
            process:
              # Scoped by subject as well as id, so holding an id is not enough
              # to throw away somebody else's day. The chunks go with it through
              # the foreign key, so erasure cannot half-happen and leave the
              # person's words behind in a table nobody is looking at.
              - type: sql
                name: delete-entry
                settings:
                  connector: db
                  exec: true
                  query: DELETE FROM journal_entry WHERE oidc_subject = $1 AND id = $2::uuid
                  args:
                    - vars.subject
                    - vars.id

  # Keeping an entry, and letting it go again.
  #
  # PUT and DELETE rather than a body with a flag in it: the method is the verb,
  # and there is nothing else about a bookmark to say. No key travels here — a
  # flag is not content, and this route neither reads nor writes any.
  - name: entry-bookmark
    source:
      connector: api
      type: http
      settings:
        path: /entries/{subject}/{id}/bookmark
        methods: [PUT, DELETE]
    process:
      - type: sql
        name: set-bookmark
        settings:
          connector: db
          query: |
            UPDATE journal_entry
            SET bookmarked = $3, updated_at = now()
            WHERE oidc_subject = $1 AND id = $2::uuid
            RETURNING id, thread_key, entry_date, title, content, bookmarked, created_at, updated_at
          args:
            - vars.subject
            - vars.id
            - 'vars.method == "PUT"'
          single: true
      - type: if
        name: check-found
        condition: 'body == null'
        then:
          process:
            - type: set-variable
              settings: { name: httpStatus, value: "404" }
            - type: set-payload
              settings:
                value: '{"error": "entry not found"}'

  # The days with something on them, for the calendar. Dates and nothing else:
  # they are already in the clear in every other query here, and a count would
  # say how much was written on a day nobody asked to open.
  - name: entry-days
    source:
      connector: api
      type: http
      settings:
        path: /entries/{subject}/days
        methods: [GET]
    process:
      - type: sql
        name: select-days
        settings:
          connector: db
          query: |
            SELECT DISTINCT entry_date
            FROM journal_entry
            WHERE oidc_subject = $1
            ORDER BY entry_date DESC
          args:
            - vars.subject
      - type: set-payload
        name: wrap
        settings:
          value: '{"days": body.map(r, r.entry_date.substring(0, 10))}'

  # Search the journal, for the reader rather than for the model.
  #
  # Meaning gets the candidates and a model picks among them: closest-by-vector
  # alone answers "which of these is nearest", which is not the question a
  # person typed. So the shortlist is opened, read, and cut down to the ones
  # that actually bear on what was asked.
  #
  # The key is on the body because this is a request that needs it: nothing can
  # rank what it cannot read. It is lifted into a variable, used for the length
  # of the request the reader started, and kept nowhere. What leaves is the
  # entries still sealed — the browser opens those the way it opens any other —
  # and, per hit, two lines of plaintext: one the model wrote saying why the day
  # is here, and one copied out of the day itself saying where. Both are the
  # same concession the disclaimer already names — searching means reading —
  # and neither is written down.
  - name: entry-search
    source:
      connector: api
      type: http
      settings:
        path: /entries/{subject}/search
        methods: [POST]
        timeout: 60s
    process:
      - type: set-variable
        name: hold-key
        settings: { name: dataKey, value: body.key }
      - type: set-variable
        name: hold-question
        settings: { name: question, value: body.query }
      # Clamped rather than trusted: every row past this one is decrypted, put
      # in a prompt and paid for, and the BFF is not the only thing that can
      # reach this port.
      - type: set-variable
        name: hold-limit
        settings:
          name: shortlist
          value: 'has(body.limit) && body.limit > 0 ? math.least(body.limit, 20) : 8'
      # Lifted with the rest: by the time the shortlist is built the body is
      # what the last statement returned, and the request that carried this is
      # gone.
      - type: set-variable
        name: hold-locale
        settings:
          name: answerIn
          value: 'has(body.locale) && body.locale != "" ? body.locale : "en"'
      - type: ai-embed
        name: embed-question
        settings:
          connector: router
          model: ${EMBEDDING_MODEL}
          dimensions: 1024
          text: 'vars.question'
          resultVar: vector
      # One row per entry, ranked by the chunk that got it here. DISTINCT ON is
      # what keeps a long day from filling the shortlist with itself.
      - type: sql
        name: search-chunks
        settings:
          connector: db
          query: |
            SELECT * FROM (
              SELECT DISTINCT ON (e.id)
                     e.id, e.thread_key, e.entry_date, e.title, e.content,
                     e.bookmarked, e.created_at, e.updated_at,
                     (c.embedding <=> $2::vector) AS distance
              FROM journal_entry e
              JOIN journal_entry_chunk c ON c.entry_id = e.id
              WHERE e.oidc_subject = $1 AND c.embedding IS NOT NULL
              ORDER BY e.id, distance
            ) best
            ORDER BY best.distance
            LIMIT $3
          args:
            - vars.subject
            - 'toJson(vars.vector)'
            - vars.shortlist
      - type: set-variable
        name: hold-found
        settings: { name: found, value: body }
      - type: if
        name: anything-to-rank
        condition: 'size(vars.found) == 0'
        then:
          process:
            # Nothing written, or nothing embedded yet. An empty answer, not an
            # error, and no model call to pay for.
            - type: set-payload
              settings: { value: '{"results": []}' }
        else:
          process:
            # The whole day, not the paragraph that matched it.
            #
            # Chunks are how an entry is found; they are not how it is judged. A
            # model shown one paragraph of a day answers about that paragraph —
            # asked what happened to somebody's knee, and handed the morning run
            # from the same entry, it will correctly say it does not know.
            #
            # Opened here and nowhere else. This body is what the model is
            # handed; it is never stored and never logged.
            - type: set-payload
              name: open-the-shortlist
              settings:
                value: >
                  {"question": vars.question,
                   "answerIn": vars.answerIn,
                   "entries": vars.found.map(r, {
                    "id": r.id,
                    "date": r.entry_date.substring(0, 10),
                    "title": r.title.startsWith("enc1:") ? string(fromAes(base64.decode(r.title.substring(5)), base64.decode(vars.dataKey))) : r.title,
                    "text": r.content.startsWith("enc1:") ? string(fromAes(base64.decode(r.content.substring(5)), base64.decode(vars.dataKey))) : r.content
                  })}
            - type: ai-mapping
              name: rank-hits
              settings:
                connector: router
                prompt: >
                  These are entries from one person's journal, already narrowed
                  by meaning, and the question that person asked of their own
                  writing.


                  Keep only the entries that actually bear on the question, most
                  useful first, and drop the rest — an empty list is the right
                  answer when none of them do. Do not rank by how close the
                  words are; rank by whether reading that day would answer what
                  was asked.


                  For each one you keep, `why` is a single short sentence
                  saying what in that day answers the question. Write it to
                  them, about their own day, and write it in the language named
                  by `answerIn` — that is the language they are reading in, and
                  it is given to you rather than guessed at.


                  `quote` is the part of that day the answer rests on, copied
                  out of it word for word: a sentence or two, in the words they
                  wrote, in the language they wrote them in. Do not translate
                  it, do not tidy it, and do not write one of your own — `why`
                  is yours to write, `quote` is theirs. If the day answers the
                  question but no one sentence in it carries the answer, keep
                  the day and leave `quote` out — dropping a day that belongs in
                  the list is the worse mistake of the two.


                  Never invent an id, and never return one that was not given to
                  you.
                outputSchema: |
                  {
                    "type": "object",
                    "required": ["results"],
                    "properties": {
                      "results": {
                        "type": "array",
                        "items": {
                          "type": "object",
                          "required": ["id", "why"],
                          "properties": {
                            "id": { "type": "string" },
                            "why": { "type": "string" },
                            "quote": { "type": "string" }
                          }
                        }
                      }
                    }
                  }
            - type: set-variable
              name: hold-ranked
              settings: { name: ranked, value: body.results }
            # The quote is asked for and not insisted on: a model that returns
            # the day without the sentence still found the right day, and losing
            # the excerpt is better than losing the search.
            #
            # Rejoined to the rows as they are stored. An id the model invented
            # matches nothing and is dropped rather than answered with a hole,
            # which is also what makes the index below safe. An id it named
            # twice is kept once, at the place it first put it: the schema does
            # not require them to be distinct, and a day cannot be two results.
            - type: set-payload
              name: rejoin
              settings:
                value: >
                  {"results": lists.range(size(vars.ranked))
                    .filter(i, vars.found.exists(f, f.id == vars.ranked[i].id)
                               && !lists.range(i).exists(j, vars.ranked[j].id == vars.ranked[i].id))
                    .map(i, vars.ranked[i])
                    .map(r, {
                      "why": r.why,
                      "quote": has(r.quote) ? r.quote : "",
                      "entry": vars.found.filter(f, f.id == r.id).map(f, {
                        "id": f.id,
                        "thread_key": f.thread_key,
                        "entry_date": f.entry_date,
                        "title": f.title,
                        "content": f.content,
                        "bookmarked": f.bookmarked,
                        "created_at": f.created_at,
                        "updated_at": f.updated_at
                      }).first()
                    })}

  # --- the agent's tools -----------------------------------------------------

  # Write this conversation's note, or an older entry named by id.
  #
  # The note is rewritten whole every time rather than appended to: the model is
  # handed what it wrote last and hands back the new version, so the entry reads
  # as one piece of writing instead of a pile of additions.
  - name: entry-write
    process:
      # A chunk is a paragraph. For now nothing merges the short ones and nothing
      # splits the long ones: a day written as prose falls into its parts on the
      # blank lines already in it, and a rule cleverer than that is worth having
      # only once there is an entry it gets wrong.
      #
      # Line endings are normalised first — CRLF and the lone CR both — so a
      # note that arrived with either is not one enormous chunk. A blank line
      # carrying spaces still is: splitting on that needs a regex and CEL has
      # none, and every note here is written by the agent, which does not
      # produce them. Said out loud rather than worked around.
      #
      # Each one is embedded with the title in front of it, so a paragraph that
      # says "it went again on the stairs" still carries what the day was about.
      - type: set-variable
        name: split-into-chunks
        settings:
          name: chunks
          value: 'body.content.replace("\r\n", "\n").replace("\r", "\n").split("\n\n").map(p, p.trim()).filter(p, p != "")'
      # Set before the embedding is attempted, so the path where there are no
      # vectors needs no branch of its own.
      - type: set-variable
        name: no-vectors
        settings: { name: chunkJson, value: '""' }
      # Best effort, deliberately. An entry that could not be embedded is still
      # an entry; losing what somebody said because a vector provider was down
      # would be the wrong trade. It costs its place in search until it is
      # written again.
      - type: handle-errors
        name: embed-if-we-can
        process:
          # One call for the whole entry: a list in, the vectors back in the same
          # order.
          - type: ai-embed
            name: embed-chunks
            settings:
              connector: router
              model: ${EMBEDDING_MODEL}
              dimensions: 1024
              text: 'vars.chunks.map(c, body.title + "\n\n" + c)'
              resultVar: vectors
          # Sealed the same way the entry is, under the same key. A chunk is the
          # person's words cut smaller, not something less private than they are.
          - type: set-variable
            name: build-chunks
            settings:
              name: chunkJson
              value: >
                toJson(lists.range(size(vars.chunks)).map(i, {
                  "ordinal": i,
                  "content": "enc1:" + base64.encode(toAes(vars.chunks[i], base64.decode(vars.dataKey))),
                  "embedding": vars.vectors[i]
                }))
        error:
          - type: set-variable
            settings: { name: chunkJson, value: '""' }
      # Sealed here, under the key this run was handed. The marker is ours, not
      # octo's: it is what tells a reader whether a row predates the key.
      - type: set-variable
        name: seal-title
        settings:
          name: sealedTitle
          value: '"enc1:" + base64.encode(toAes(body.title, base64.decode(vars.dataKey)))'
      - type: set-variable
        name: seal-content
        settings:
          name: sealedContent
          value: '"enc1:" + base64.encode(toAes(body.content, base64.decode(vars.dataKey)))'
      - type: switch
        name: new-or-known
        cases:
          - when: 'has(body.id) && body.id != ""'
            process:
            # An older entry, named. Scoped by subject as well as id, so holding
            # an id is not enough to write into somebody else's journal.
            - type: sql
              name: update-entry
              settings:
                connector: db
                query: |
                  UPDATE journal_entry
                  SET title = $3,
                      content = $4,
                      updated_at = now()
                  WHERE oidc_subject = $1 AND id = $2::uuid
                  RETURNING id, thread_key, entry_date, title, content, bookmarked, created_at, updated_at
                args:
                  - vars.subject
                  - body.id
                  - vars.sealedTitle
                  - vars.sealedContent
                single: true

          # The entry the reader has open, which they may have started
          # themselves a moment ago — the browser mints the id, so an entry that
          # has never been written is addressed the same way as one that has.
          - when: 'has(vars.entryId) && vars.entryId != ""'
            process:
            - type: sql
              name: write-open-entry
              settings:
                connector: db
                query: |
                  INSERT INTO journal_entry
                    (id, oidc_subject, thread_key, entry_date, title, content)
                  VALUES
                    ($2::uuid, $1, '', COALESCE(NULLIF($3, '')::date, CURRENT_DATE), $4, $5)
                  -- The whole argument for letting a browser choose a primary
                  -- key. An id that collides with somebody else's row fails this
                  -- condition, so the statement updates nothing and returns
                  -- nothing, and the tool answers "saved: false" — the same
                  -- answer an id that names nothing already gets. A colliding id
                  -- is therefore worth no more than a wrong one.
                  ON CONFLICT (id) DO UPDATE SET
                    title = EXCLUDED.title,
                    content = EXCLUDED.content,
                    updated_at = now()
                  WHERE journal_entry.oidc_subject = $1
                  RETURNING id, thread_key, entry_date, title, content, bookmarked, created_at, updated_at
                args:
                  - vars.subject
                  - vars.entryId
                  - 'has(vars.entryDate) && vars.entryDate != "" ? vars.entryDate : vars.today'
                  - vars.sealedTitle
                  - vars.sealedContent
                single: true

          - when: "true"
            process:
            # One running note per conversation. The conflict target is the
            # partial unique index, which is what makes "keep writing the same
            # note" a guarantee rather than something the prompt has to get
            # right every turn.
            - type: sql
              name: upsert-entry
              settings:
                connector: db
                query: |
                  INSERT INTO journal_entry
                    (oidc_subject, thread_key, entry_date, title, content)
                  VALUES
                    ($1, $2, COALESCE(NULLIF($3, '')::date, CURRENT_DATE), $4, $5)
                  -- entry_date is deliberately NOT updated. A note belongs to
                  -- the day it is about, and advancing it would move the note
                  -- off that day and leave it empty — a conversation picked up
                  -- a week later would silently take last Tuesday's evening
                  -- with it. updated_at is what says it was touched since.
                  ON CONFLICT (oidc_subject, thread_key) WHERE thread_key <> ''
                  DO UPDATE SET
                    title = EXCLUDED.title,
                    content = EXCLUDED.content,
                    updated_at = now()
                  RETURNING id, thread_key, entry_date, title, content, bookmarked, created_at, updated_at
                args:
                  - vars.subject
                  - vars.threadId
                  - 'has(body.date) && body.date != "" ? body.date : vars.today'
                  - vars.sealedTitle
                  - vars.sealedContent
                single: true
      - type: set-variable
        name: hold-written
        settings: { name: written, value: body }
      - type: if
        name: check-written
        condition: 'vars.written == null'
        then:
          process:
            # An id that named nothing of this person's. The model is told
            # nothing was written rather than the tool failing under it: reaching
            # for the wrong entry is an ordinary mistake to recover from.
            - type: set-payload
              settings: { value: '{"saved": false}' }
        else:
          process:
            # Wholesale, the way the note itself is rewritten: the entry that
            # came back is the whole of it, so its chunks are the whole of its
            # chunks. Skipped entirely when the embedding failed, which leaves
            # the last good set standing rather than emptying the entry out of
            # search on a bad afternoon.
            #
            # One statement, because two would not be one transaction: a delete
            # that committed and an insert that then failed on a malformed
            # vector would leave the entry saved and unfindable. Writing first
            # and trimming after means the worst a failure can do is leave the
            # chunks exactly as they were.
            - type: if
              name: chunks-to-write
              condition: 'vars.chunkJson != ""'
              then:
                process:
                  - type: sql
                    name: write-chunks
                    settings:
                      connector: db
                      # The tail is what an entry that got shorter leaves
                      # behind: ordinals are dense from zero, so anything at or
                      # past the new count is a paragraph that is gone.
                      #
                      # `current` is the race guard. Two runs can write the same
                      # entry — two conversations can be pointed at one — and a
                      # block is its own transaction, so the older one can reach
                      # here last and leave the newer entry paired with older
                      # chunks. The stamp this run's own write returned is what
                      # says whether it is still the newest; if it is not, the
                      # insert matches nothing and the delete is held back by
                      # the same test, so a run that lost writes nothing at all.
                      query: |
                        WITH current AS (
                          SELECT updated_at FROM journal_entry WHERE id = $1::uuid
                        ),
                        written AS (
                          INSERT INTO journal_entry_chunk
                            (entry_id, ordinal, content, embedding, embedded_at)
                          SELECT $1::uuid, (c->>'ordinal')::int, c->>'content',
                                 (c->>'embedding')::vector, now()
                          FROM jsonb_array_elements($2::jsonb) AS c, current
                          WHERE current.updated_at = $3::timestamptz
                          ON CONFLICT (entry_id, ordinal) DO UPDATE SET
                            content = EXCLUDED.content,
                            embedding = EXCLUDED.embedding,
                            embedded_at = EXCLUDED.embedded_at
                          RETURNING ordinal
                        )
                        DELETE FROM journal_entry_chunk
                        WHERE entry_id = $1::uuid
                          AND ordinal >= (SELECT count(*) FROM written)
                          AND EXISTS (
                            SELECT 1 FROM current WHERE updated_at = $3::timestamptz
                          )
                      args:
                        - vars.written.id
                        - vars.chunkJson
                        - vars.written.updated_at
                      exec: true
            # The panel beside the conversation, repainted mid-run. Sealed,
            # because the reader opens an entry exactly one way whether it
            # arrived in a page or in a frame.
            - type: if
              name: tell-the-reader
              condition: 'has(vars.sseStream) && vars.sseStream != ""'
              then:
                process:
                  - type: sse-event
                    name: entry-frame
                    settings:
                      event: entry
                      data: 'toJson(vars.written)'
                      ifClosed: ignore
            # What the model gets back is what it just wrote, confirmed, so it
            # knows the id to keep writing into.
            - type: set-payload
              name: written-result
              settings:
                value: >
                  {"saved": true, "id": vars.written.id,
                   "date": vars.written.entry_date.substring(0, 10)}

  # Find entries — by a day, by a range, or by what they were about.
  #
  # The two searches are different questions, not one query with a switch in it:
  # a date narrows, meaning ranks. A meaning search ignores dates entirely, and
  # says so in its description, so the model does not expect both at once.
  - name: entry-find
    process:
      - type: if
        name: by-meaning-or-by-day
        condition: 'has(body.query) && body.query != ""'
        then:
          process:
            - type: ai-embed
              name: embed-question
              settings:
                connector: router
                model: ${EMBEDDING_MODEL}
                dimensions: 1024
                text: 'body.query'
                resultVar: vector
            # Cosine distance, matching the index. An entry is ranked by its
            # closest chunk rather than by all of them averaged: a day is
            # usually several things, and the one the question is about should
            # not be dragged down by the others it sat beside. The GROUP BY is
            # what makes this a list of days rather than a list of paragraphs.
            #
            # Entries written while the embedding provider was unreachable have
            # no chunks and cannot be ranked; they are still found by date.
            - type: sql
              name: search-entries
              settings:
                connector: db
                query: |
                  SELECT e.id, e.entry_date, e.title, e.content, e.created_at, e.updated_at
                  FROM journal_entry e
                  JOIN journal_entry_chunk c ON c.entry_id = e.id
                  WHERE e.oidc_subject = $1 AND c.embedding IS NOT NULL
                  GROUP BY e.id, e.entry_date, e.title, e.content, e.created_at, e.updated_at
                  ORDER BY min(c.embedding <=> $2::vector)
                  LIMIT $3
                args:
                  - vars.subject
                  - 'toJson(vars.vector)'
                  - 'has(body.limit) && body.limit > 0 ? body.limit : 5'
        else:
          process:
            - type: sql
              name: list-entries
              settings:
                connector: db
                query: |
                  SELECT id, entry_date, title, content, created_at, updated_at
                  FROM journal_entry
                  WHERE oidc_subject = $1
                    AND ($2 = '' OR entry_date = $2::date)
                    AND ($3 = '' OR entry_date >= $3::date)
                    AND ($4 = '' OR entry_date <= $4::date)
                  ORDER BY entry_date DESC, created_at DESC
                  LIMIT $5
                args:
                  - vars.subject
                  - 'has(body.date) && body.date != "" ? body.date : ""'
                  - 'has(body.from) && body.from != "" ? body.from : ""'
                  - 'has(body.to) && body.to != "" ? body.to : ""'
                  - 'has(body.limit) && body.limit > 0 ? body.limit : 10'
      - type: set-payload
        name: opened
        settings:
          value: >
            {"entries": body.map(r, {
              "id": r.id,
              "date": r.entry_date.substring(0, 10),
              "title": r.title.startsWith("enc1:") ? string(fromAes(base64.decode(r.title.substring(5)), base64.decode(vars.dataKey))) : r.title,
              "content": r.content.startsWith("enc1:") ? string(fromAes(base64.decode(r.content.substring(5)), base64.decode(vars.dataKey))) : r.content
            })}

  # One entry, opened for the model to read before it adds to it.
  - name: entry-read
    process:
      - type: sql
        name: select-entry
        settings:
          connector: db
          query: |
            SELECT id, entry_date, title, content, created_at, updated_at
            FROM journal_entry
            WHERE oidc_subject = $1 AND id = $2::uuid
          args:
            - vars.subject
            - body.id
          single: true
      - type: if
        name: check-found
        condition: 'body == null'
        then:
          process:
            - type: set-payload
              settings: { value: '{"found": false}' }
        else:
          process:
            - type: set-payload
              settings:
                value: >
                  {"found": true, "id": body.id, "date": body.entry_date.substring(0, 10),
                   "title": body.title.startsWith("enc1:") ? string(fromAes(base64.decode(body.title.substring(5)), base64.decode(vars.dataKey))) : body.title,
                   "content": body.content.startsWith("enc1:") ? string(fromAes(base64.decode(body.content.substring(5)), base64.decode(vars.dataKey))) : body.content}

  # Something from around this day some months ago.
  #
  # The choice is made here rather than by the model, because a model asked to
  # pick something at random picks the same kind of thing every time — and the
  # point of this is to be surprised by what comes back.
  - name: entry-recall
    process:
      - type: sql
        name: select-recalled
        settings:
          connector: db
          # A fortnight either side: far enough that a person who does not write
          # daily still has something to find, near enough that "a year ago"
          # stays true.
          #
          # NULLIF because a run that carried no date leaves this empty, and
          # `''::date` is an error rather than a miss. NULL makes the BETWEEN
          # match nothing, so the tool answers "found nothing" — which is true,
          # and better than failing the call. There is deliberately no
          # CURRENT_DATE fallback: that is today in the database's zone, not in
          # the reader's, and recalling the wrong fortnight is worse than
          # recalling nothing.
          query: |
            SELECT id, entry_date, title, content, created_at, updated_at
            FROM journal_entry
            WHERE oidc_subject = $1
              AND entry_date BETWEEN
                    (NULLIF($2, '')::date - make_interval(months => $3::int) - interval '15 days')
                AND (NULLIF($2, '')::date - make_interval(months => $3::int) + interval '15 days')
            ORDER BY random()
            LIMIT 1
          args:
            - vars.subject
            - 'has(vars.today) ? vars.today : ""'
            - 'has(body.months) && body.months > 0 ? body.months : 12'
          single: true
      - type: if
        name: check-found
        condition: 'body == null'
        then:
          process:
            - type: set-payload
              settings: { value: '{"found": false}' }
        else:
          process:
            - type: set-payload
              settings:
                value: >
                  {"found": true, "id": body.id, "date": body.entry_date.substring(0, 10),
                   "title": body.title.startsWith("enc1:") ? string(fromAes(base64.decode(body.title.substring(5)), base64.decode(vars.dataKey))) : body.title,
                   "content": body.content.startsWith("enc1:") ? string(fromAes(base64.decode(body.content.substring(5)), base64.decode(vars.dataKey))) : body.content}

  # Move the reader's panel to an entry. Writes nothing.
  #
  # The frame carries the row sealed, the way the routes do, so the panel has
  # exactly one kind of entry to open however it arrived.
  - name: entry-open
    process:
      - type: sql
        name: select-entry
        settings:
          connector: db
          query: |
            SELECT id, thread_key, entry_date, title, content, bookmarked, created_at, updated_at
            FROM journal_entry
            WHERE oidc_subject = $1 AND id = $2::uuid
          args:
            - vars.subject
            - body.id
          single: true
      - type: if
        name: check-found
        condition: 'body == null'
        then:
          process:
            - type: set-payload
              settings: { value: '{"opened": false}' }
        else:
          process:
            - type: set-variable
              name: hold-entry
              settings: { name: opened, value: body }
            # A tool that runs with nobody reading still has to answer the
            # model; only the frame is conditional.
            - type: if
              name: tell-the-reader
              condition: 'has(vars.sseStream) && vars.sseStream != ""'
              then:
                process:
                  - type: sse-event
                    name: open-frame
                    settings:
                      event: open
                      data: 'toJson(vars.opened)'
                      ifClosed: ignore
            - type: set-payload
              name: opened-result
              settings:
                value: '{"opened": true, "id": vars.opened.id, "date": vars.opened.entry_date.substring(0, 10)}'
