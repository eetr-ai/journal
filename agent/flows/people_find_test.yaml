# See people_test.yaml. This suite owns the tool that looks people up.
#
# Where a case reads a name in the clear, that is the seal being opened under
# the throwaway key passed as `dataKey`.
flow: people-find

env:
  POSTGRES_DSN: postgres://journal:journal@localhost:5432/journal?sslmode=disable
  OPENROUTER_API_KEY: dolphin-not-a-key

# Word matching is what this suite proves, so ranking by meaning fails here and
# every answer is matches alone. people_related_test.yaml owns the ranking.
mocks:
  people-find.by-meaning[then].rank-if-we-can[process].embed-circle:
    cases:
      - when: "true"
        error: no embedding provider here

cases:
  # "carla" is written in lower case, so a sort that is not case-insensitive
  # puts her last.
  - name: everyone comes back opened, by name, whatever the case it was written in
    input:
      data: {}
      vars: { subject: dolphin-people, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        - body.people.map(p, p.name) == ["Ana Torres", "Bruno", "carla", "Diego", "Elena", "Fede"]
        - body.people[0].relation == "my sister"
        - body.people[0].birthday == "1990-11-02"
        # Unmarked, so it reads as itself.
        - body.people[2].birthday == ""
        # A number where it is known; null where it is sealed empty or unmarked.
        - body.people.map(p, p.proximity) == [5, 3, null, 1, null, null]
        # The roster counts facts rather than carrying them, and keeps the notes
        # that tell people apart.
        - body.people[0].facts == 2
        - body.people[1].facts == 0
        - body.people[0].notes == "Lives in Rosario."
        - body.related == []

  - name: a query finds whatever holds it, in any case
    input:
      data: { query: AR }
      vars: { subject: dolphin-people, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        # Ana by her notes and facts, Rosario and the library; Bruno by his
        # relation, climbing partner; carla by her name.
        - body.people.map(p, p.name) == ["Ana Torres", "Bruno", "carla"]
        # A match carries its facts, opened, rather than a count.
        - body.people[0].facts == ["Allergic to cats.", "Started a new job at the library."]

  - name: every word of a query has to be somewhere, in any order
    input:
      data: { query: "  cats   ALLERGIC " }
      vars: { subject: dolphin-people, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        - body.people.map(p, p.name) == ["Ana Torres"]

  - name: one word that is nowhere is enough to rule someone out
    input:
      data: { query: allergic dogs }
      vars: { subject: dolphin-people, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        - body.people == []

  - name: accents are folded on both sides
    input:
      data: { query: ROSÁRIO }
      vars: { subject: dolphin-people, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        - body.people.map(p, p.name) == ["Ana Torres"]

  - name: a query finds someone by what they are called
    input:
      data: { query: GUITO }
      vars: { subject: dolphin-people, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        - body.people.map(p, p.name) == ["Diego"]
        - body.people[0].nickname == "Dieguito"

  - name: a query that matches nobody is an empty answer
    input:
      data: { query: nobody by this name }
      vars: { subject: dolphin-people, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      body:
        people: []
        related: []

  - name: nobody from somebody else's circle is found
    input:
      data: { query: not yours }
      vars: { subject: dolphin-people, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      body:
        people: []
        related: []
