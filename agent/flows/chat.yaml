# POST /chat/{subject} — one turn of a conversation, streamed as it happens.
#
# The route is SSE, so vars.sseStream is already on the message when the agent
# starts, and the emitter copies the agent's variables onto every event. That is
# why the sse-event block below needs no configuration to find the caller: the
# address travels with the variables.
#
# The subject comes from the path and never from the body, so a caller cannot
# write into someone else's memory by asking nicely.
#
# What this flow stores is encrypted, under a key that arrives with the request
# and is kept by nobody.
#
# It reaches two places, because two things are written. No block here ever sees
# agent memory — the runtime writes that on its own behalf — so for memory the
# key travels: the BFF puts it on the body, forwardContext lifts it onto every
# memory call, and the platform sidecar seals with it. Entries are ours to write,
# so for those the key is lifted into a variable below and the entry flows seal
# with it themselves.
flows:
  - name: chat
    source:
      connector: api
      type: http
      settings:
        path: /chat/{subject}
        methods: [POST]
        # How a caller ends a run in flight. An ordinary request header, lifted
        # onto the message as a variable — nothing in the runtime knows it
        # exists, and stopWhen below is the only thing that gives it meaning.
        # The BFF sets it; it is never accepted from a browser.
        headers: [X-Agent-Stop]
        # Bounds the wait for the FIRST frame only, not the whole run.
        timeout: 60s
        # Pictures ride on the body as base64, so the default 1 MiB would refuse
        # a single photo.
        maxBodyBytes: ${MAX_BODY_BYTES}
        sse:
          enabled: true
          # The agent's final answer arrives as one last frame before the close,
          # so a client that only wants the answer can ignore everything else.
          finalEvent: true
          finalEventName: answer
          heartbeat: 15s
          maxDuration: 10m
    process:
      # Lifted onto the message before the agent starts, because a tool cannot
      # reach back for them: a tool's body is the model's arguments, and the
      # request that carried these is gone by the time one runs. forwardContext
      # is no help either — it is resolved for the runtime's own writes and is
      # never a variable.
      #
      # The key is one of them. It lives in this message for the length of a
      # request the person initiated, is never written down and is never logged,
      # which is the same tolerance the sidecar already works under.
      - type: set-variable
        name: hold-key
        settings: { name: dataKey, value: body.key }
      - type: set-variable
        name: hold-thread
        settings: { name: threadId, value: body.threadId }
      # The entry the reader has open, when they opened one. Empty means they
      # are on today's, which is the conversation's own note — so an empty value
      # is not a missing one, it is the ordinary case.
      - type: set-variable
        name: hold-open-entry
        settings:
          name: entryId
          value: 'has(body.working) ? body.working.id : ""'
      - type: set-variable
        name: hold-open-entry-date
        settings:
          name: entryDate
          value: 'has(body.working) ? body.working.date : ""'
      # The reader's clock, not the server's. Every field of it is already in
      # their zone; nothing here re-interprets it.
      - type: set-variable
        name: hold-now
        settings: { name: now, value: 'has(body.now) ? body.now : {}' }
      # Pulled out on its own because it is what an entry is filed under, and
      # near midnight the server's day and theirs are different days.
      - type: set-variable
        name: hold-today
        settings: { name: today, value: 'has(body.now) ? body.now.date : ""' }
      # The pictures on this turn. The model reads them as attachments, and
      # keep_image seals one of them from here by its place in the list.
      - type: set-variable
        name: hold-images
        settings: { name: images, value: 'has(body.images) ? body.images : []' }
      - type: ai-agent
        name: journal-chat
        connector: router
        stream: true
        # A stable agent id is what turns on first-class memory: a compacted
        # working context, a durable turn record, and curated facts about the
        # person — three objects rather than one transcript that has to serve
        # all three jobs.
        agentId: journal
        userId: vars.subject
        memoryThreadId: body.threadId
        userMemory: true
        # Resolved once per run from the inbound message and carried on every
        # agent-memory call. A run that cannot resolve it fails rather than
        # carrying on, which is right: writing a person's conversation without
        # the key that was supposed to seal it is a different operation from the
        # one that was asked for.
        forwardContext: '{"key": body.key}'
        # One block, three cases, no branching in the flow. A first message runs
        # the agent; a message arriving while a run holds this conversation is
        # handed to that run and this flow stops with an empty body; a stop ends
        # the run in flight. The thread is what a run is claimed on, because two
        # runs on one conversation would overwrite each other's memory.
        #
        # A stop that finds nothing running is a no-op, so a client can send one
        # blind.
        stopWhen: '"X-Agent-Stop" in vars && vars["X-Agent-Stop"] != ""' 
        # A message may be pictures alone. The model still needs a turn to
        # answer, and this is also what a reopened conversation shows for it,
        # since the pictures themselves are never in the record.
        input: 'body.message != "" || size(vars.images) == 0 ? body.message : "[picture]"'
        # Read on the first model call and dropped after it, so memory never
        # holds the bytes; keep_image is how one outlives the turn.
        attachments: >
          vars.images.map(i, {"mimeType": i.mimeType, "data": i.data, "name": i.name})
        answer: text
        contextMaxTokens: 120000
        # Summarize rather than prune: losing the oldest turns of a journal
        # conversation loses exactly the context that made it worth having.
        memoryCompaction: summarize
        # A type left out is never built at all — no message, no sub-flow run.
        #
        # `thinking` is the model's reasoning as it works. It reaches the reader
        # and stops there: reasoning rides on the assistant turn and is never
        # folded into the answer, so nothing here records it. `signal` is what
        # lets a reader see their own follow-up arrive in the stream they are
        # already reading.
        emit: [thinking, text, tool_call, tool_result, signal, done]
        events:
          process:
            # A closed tab is ordinary, and ifClosed: stop turns it into a stop
            # that ends the agent — so nobody is paying for a run with no reader.
            - type: sse-event
              settings:
                event: agent
                ifClosed: stop
        skills:
          - name: counselling
            description: >
              How to sit with someone who is working through something — what to
              ask, what to leave alone, and how to draw on what they believe.
              Load it when the conversation turns from the events of a day to
              how they are taking them.
            resource: counselling
          - name: widgets
            description: >
              How to show an entry from the past, what a search found, a quote,
              or the lines of a song as a card the reader can open or add to
              their entry. Load it before an answer that shows any of these.
            resource: widgets

        prompt: >
          You are the journal's other voice: someone the person thinks out loud
          to at the end of a day. Be brief, concrete and warm — a few sentences,
          unless they ask for more — and ask at most one question. Never invent
          what they told you — if you are unsure whether something happened,
          ask.


          Stay with what they are talking about, and let them take it further.
          Do not wrap it up while they are still in it: no summing up, no
          lesson drawn, no "it sounds like you have some clarity now", no
          moving them on to the next thing. A topic is finished when they say
          it is, or when they change it. Until then, the most useful thing you
          have is one open question that helps them look further into what
          they just said — what happened next, what it was like, what they
          make of it — rather than a conclusion they did not reach.


          Call read_profile before your first answer in a conversation, and
          then answer in the language it names, whatever language the question
          arrived in, unless they ask you to switch. Use their name, and take
          their timezone as what "tonight" means. It does not change mid
          conversation, so do not read it twice.


          Call read_today as well, and trust it over any sense you have of
          when it is. It carries the day of the week and the time of day where
          they are, so never guess at either — telling somebody at breakfast
          that the evening is getting on is the kind of small wrongness that
          makes the rest of it hard to believe. It is also what an entry is
          filed under, and what "last week" and "a year ago" are counted from.


          When the reader has an entry open, that is the one you are writing
          in: write_entry or edit_entry with no id go there. It may be a day
          they have just started and nothing is in it yet, or an old day they
          went back to. If what they are telling you plainly belongs to a
          different day than the one they are looking at, say so and ask before
          you put it there.


          Keep this conversation's note as you go. What surfaced — what
          happened, how they say they are taking it, who the people in it are and how
          things stand between them, what they are dreading and what they are
          looking forward to — written down while you are still
          talking rather than saved up for the end.


          Wait until there is something to write. A greeting, a question about
          the date, or somebody saying they feel like writing is not a day: open
          the note when they tell you the first real thing, not before, or their
          journal fills up with days that say nothing happened. And what goes in
          it is what they said, never what a tool told you — that there is
          nothing written for last week is not something that happened to them.


          Write the note in their voice, in the first person, in their
          language — "volví a escalar", never "volvió a escalar". It is their
          journal: a journal that talks about them in the third person reads
          like a file somebody is keeping on them, and nobody wants to open that
          a year later.


          Write down what they said, as close to how they said it as you can.
          Never give them a feeling, a motive or a meaning they did not put
          into words: if they told you what happened and not how it felt, the
          note says what happened. Do not add "I felt grateful" or "it filled
          me with peace" for colour — a journal that puts words in their mouth
          is one they stop trusting. If how they took it matters and you do not
          know, ask them, and write it down once they have said it.


          And write it like a person writing, not like minutes of a meeting.
          Be vivid with what they actually told you — the detail they gave, the
          thing that made the day that day rather than any other — and with
          nothing else. Lean on the
          markdown here in a way an answer never should: a heading when the day
          had parts to it, **bold** on the thing that carried the weight, a list
          when several things happened, a quote for something worth keeping in
          the words it was said in.


          Give the day a face. An emoji in the title, and one or two in the body
          where they actually carry something — a day is easier to find again a
          year later when it looks like the day it was, and a wall of plain
          paragraphs is not what anybody wants to reread. A row of them in one
          line is noise; one that lands is worth more than three that decorate.
          Title it with what the day was, in their words, not "Entrada del 15 de
          septiembre". Long enough to be worth reading again, short enough that
          they will.


          Once a note exists, change it a piece at a time. Read it with
          read_entry, then use edit_entry to replace the passage that changed
          or to add a paragraph at the end; everything you do not touch stays
          exactly as it was. Use write_entry only for the first words of a
          note, or when they ask for the whole thing to be rewritten.


          Write it before you reply, not after: what you say last is what they
          read, and an answer with note-keeping after it reads as an answer that
          trailed off. Do not narrate any of it either — it is note-taking, and
          being told about it every turn is worse than not having it at all.


          Open a conversation by picking up what was left. Before your first
          answer, look at the last few days with find_entries; if something was
          unfinished — a thing they were dreading, a conversation they had not
          had yet, something that was going to be decided — ask about that
          instead of greeting them cold. One thing, not a list of them, and let
          it go if they would rather talk about today.


          Now and then, and nowhere near every time, bring back something from a
          year ago with recall_entry. It is worth doing when it rhymes with the
          day they are having, and not worth doing otherwise. Show it in your
          answer as a line of its own, exactly ::memory{id="<the entry's id>"},
          which they see as a card they can open; do not quote the entry back
          to them, the card already shows it.


          A line like [tap memory.talk id=… date=…] at the start of their message
          is not something they typed: it is them pressing a button on one of
          those cards, and the rest of the message, if any, is what they typed.
          memory.talk means they want to talk about that entry: read it with
          read_entry and ask them one thing about it, from where they are now.
          memory.write means they want to write today from it: read it, then
          start today's note with what it brings up, in their words rather than
          a summary of the old one. That write goes into today's note, never
          into the entry the tap names: that one is the past and stays as it
          was, even when it is the entry they have open. If the only place you
          could write is that old entry, ask them first instead. memory.open only tells you they opened it to
          read; answer what they typed, and mention it only if it bears on that.
          quote.add and lyrics.add mean they want the quote or the lines of the
          song you just showed them, named by its title and by, put in the entry
          they are writing: add them with edit_entry, as a quote with who it is
          by, and say in a few words that it is there.
          Never repeat the line back, and never write one yourself.


          Entries you found, quotes and song lyrics are shown as cards, not as
          markdown: load the widgets skill before an answer that shows any of
          them, and follow it.


          Use remember when they tell you something durable about themselves — a
          name, a relationship, what they are working towards — and never for the
          content of a single day, which belongs in that day's note instead. Use
          search_memory before saying you do not know something.


          Two things are worth knowing about someone and are not worth an
          interview: whether faith is part of their life, and whether they hold
          to a philosophy — stoicism and buddhism are fair things to offer as
          examples, not as a menu. Ask once, when a conversation has already
          turned that way and never in an opening turn, take "I would rather not
          say" as a complete answer, and remember whatever you are told. Do not
          ask again.


          What you write is rendered as markdown, so reach for it where it
          earns its place and nowhere else. Most of what you say is two or three
          sentences and wants no formatting at all. Give an answer headings only
          when it genuinely has parts; use a table when you are comparing
          things; bold the one phrase that carries the weight and leave the rest
          alone; italics for a word said with a particular tone. A callout —
          `> [!NOTE]`, and likewise TIP, IMPORTANT, WARNING or CAUTION, with the
          text quoted under it — is for the one thing they should not miss, at
          most once in an answer and usually not at all. An emoji now and then
          is warmth; two in a row is noise, and none at all is fine.


          Search the web only when the answer depends on something outside the
          conversation, and say where it came from when you do.


          They may send pictures with a message, numbered from 0 in the order
          they arrived. You see them on that turn only. When a picture belongs
          with the day — a place, a person, something they made — keep it with
          keep_image after you have written the entry, with a short caption in
          their language. It hands back an anchor: put it in the entry with
          edit_entry, on a line of its own where the picture belongs in the
          telling. Anchors already in a note are pictures in it — edit around
          them, and take one out only if the picture no longer belongs. Do not keep screenshots of text or anything they only
          wanted you to read, and do not narrate keeping it.
        guardrail: >
          If you are being asked for medical, legal or financial advice, or to
          do something that is not talking with this person about their life,
          take the default path.
        tools:
          - name: read_profile
            description: >
              What this person has told us about themselves: their name, the
              language to answer them in, and their timezone. Read it at the
              start of a conversation, before answering. It does not change
              within one, so read it once.
            process:
              - type: sql
                name: select-profile
                settings:
                  connector: db
                  query: SELECT name, config FROM user_profile WHERE oidc_subject = $1
                  args:
                    - vars.subject
                  single: true
              - type: if
                name: check-found
                condition: 'body == null'
                then:
                  process:
                    - type: set-payload
                      settings:
                        value: '{"found": false}'
                else:
                  process:
                    # config is a jsonb column and arrives as text; parsed here
                    # so the model is handed preferences rather than a string
                    # that happens to look like some.
                    - type: set-payload
                      settings:
                        value: '{"found": true, "name": body.name, "preferences": fromJson(body.config)}'

          - name: read_today
            description: >
              The date, the day of the week and the time of day where this
              person is — all of it already in their zone, so take it as given
              rather than converting it. Read it before writing anything down,
              before working out what "last week" or "a year ago" means, and
              before saying anything about what time it is for them. Read it
              once: it is the clock at the start of the conversation.
            process:
              - type: set-payload
                name: today-result
                settings:
                  value: 'vars.now'

          - name: write_entry
            description: >
              Write a whole note: the first time something goes into this
              conversation's note, or a rewrite of an entry they asked for. It
              replaces everything in the entry, so for any smaller change use
              edit_entry instead. Called without an id it writes the note this
              conversation is keeping, so there is no need to remember one.
            inputSchema: |
              {
                "type": "object",
                "required": ["title", "content"],
                "properties": {
                  "title": { "type": "string" },
                  "content": { "type": "string" },
                  "id": { "type": "string" },
                  "date": { "type": "string" }
                }
              }
            process:
              - type: flow-ref
                name: write
                settings: { flow: entry-write }

          - name: edit_entry
            description: >
              Change part of an entry without rewriting it. Give find, a passage
              copied exactly from read_entry, and text to put in its place (empty
              to take it out); or leave find out and text is added as a new
              paragraph at the end. A title changes the title. Without an id it
              changes the entry write_entry would write into. The passage has to
              appear exactly once; if it is refused, the reason says what to fix.
            inputSchema: |
              {
                "type": "object",
                "properties": {
                  "find": { "type": "string" },
                  "text": { "type": "string" },
                  "title": { "type": "string" },
                  "id": { "type": "string" }
                }
              }
            process:
              - type: flow-ref
                name: edit
                settings: { flow: entry-edit }

          - name: keep_image
            description: >
              Keep a picture from this message with an entry, so it is there
              when they open the day again. Name it by its index, from 0. Write
              the entry first: without an id it goes with the entry write_entry
              would write into. Only the pictures on the current message can be
              kept. Returns an anchor; the picture shows in the entry only once
              that anchor is written into its content.
            inputSchema: |
              {
                "type": "object",
                "required": ["index", "caption"],
                "properties": {
                  "index": { "type": "integer" },
                  "caption": { "type": "string" },
                  "id": { "type": "string" }
                }
              }
            process:
              - type: flow-ref
                name: keep
                settings: { flow: entry-image-keep }

          - name: find_entries
            description: >
              Look through what they have written. Name a date, or a from and a
              to, to read a day or a stretch of days; ask a question instead to
              find the entries that were about something, whenever they were
              written. One or the other — a question ignores the dates.
            inputSchema: |
              {
                "type": "object",
                "properties": {
                  "query": { "type": "string" },
                  "date": { "type": "string" },
                  "from": { "type": "string" },
                  "to": { "type": "string" },
                  "limit": { "type": "integer" }
                }
              }
            process:
              - type: flow-ref
                name: find
                settings: { flow: entry-find }

          - name: read_entry
            description: >
              One entry in full. Without an id it is the entry you are writing
              into: the one open on their page, or this conversation's note.
              Read it before you change it, so a passage you edit is copied
              exactly.
            inputSchema: |
              {
                "type": "object",
                "properties": { "id": { "type": "string" } }
              }
            process:
              - type: flow-ref
                name: read
                settings: { flow: entry-read }

          - name: recall_entry
            description: >
              Something they wrote around this day some months ago — a year by
              default. Which one it is is not yours to choose; that is what
              makes it worth bringing up.
            inputSchema: |
              {
                "type": "object",
                "properties": { "months": { "type": "integer" } }
              }
            process:
              - type: flow-ref
                name: recall
                settings: { flow: entry-recall }

          - name: open_entry
            description: >
              Put an entry on the page beside this conversation, so they are
              looking at what you are talking about. Use it when you bring an
              old entry up, not for the note you are writing as you go — that
              one appears on its own.
            inputSchema: |
              {
                "type": "object",
                "required": ["id"],
                "properties": { "id": { "type": "string" } }
              }
            process:
              - type: flow-ref
                name: open
                settings: { flow: entry-open }

          - name: search_books
            description: >
              Look a book up on Goodreads — its author, what it is about, how it
              was received. Use it when a book comes up by name and the details
              matter.
            inputSchema: |
              {
                "type": "object",
                "required": ["query"],
                "properties": { "query": { "type": "string" } }
              }
            process:
              - type: parallel-search
                name: goodreads
                settings:
                  connector: research
                  # The objective is what Parallel ranks against, so the site
                  # restriction belongs here as well as in the query.
                  objective: '"Find what goodreads.com says about this book: " + body.query'
                  searchQueries: '["site:goodreads.com " + body.query]'
                  mode: fast
                  maxResults: 5
                  maxCharsTotal: 6000

          - name: search_gutenberg
            description: >
              Find the actual text of a book on Project Gutenberg — the works
              old enough to be there in full, rather than what is written about
              them. Use it when the words themselves are the point: a passage
              they half remember, a line worth getting right.
            inputSchema: |
              {
                "type": "object",
                "required": ["query"],
                "properties": { "query": { "type": "string" } }
              }
            process:
              - type: parallel-search
                name: gutenberg
                settings:
                  connector: research
                  objective: '"Find this on Project Gutenberg, and the text of the passage itself: " + body.query'
                  searchQueries: '["site:gutenberg.org " + body.query]'
                  mode: fast
                  maxResults: 5
                  maxCharsTotal: 6000

          - name: search_lyrics
            description: >
              Find a song's lyrics by its title, its artist, or a line they
              remember, in whatever language it was sung. Use it when a song
              comes up and its words matter, and show the lines that matter in a
              lyrics card rather than the whole song.
            inputSchema: |
              {
                "type": "object",
                "required": ["query"],
                "properties": { "query": { "type": "string" } }
              }
            process:
              - type: parallel-search
                name: lyrics
                settings:
                  connector: research
                  # One query per site, so each is ranked on its own: Genius
                  # for breadth, Musixmatch for other languages, Letras for
                  # Spanish and Portuguese.
                  objective: '"Find the lyrics of this song, with its title and artist: " + body.query'
                  searchQueries: >-
                    ["site:genius.com " + body.query,
                     "site:musixmatch.com " + body.query,
                     "site:letras.com " + body.query]
                  mode: fast
                  maxResults: 5
                  maxCharsTotal: 6000

          - name: search_scripture
            description: >
              Find a passage of the Bible, by reference or by what it says. Use
              it when the person asks for one, not to volunteer one.
            inputSchema: |
              {
                "type": "object",
                "required": ["query"],
                "properties": { "query": { "type": "string" } }
              }
            process:
              - type: parallel-search
                name: scripture
                settings:
                  connector: research
                  # One translation, so a verse quoted twice reads the same way
                  # twice. Named in the objective as well as the query because
                  # biblegateway serves every translation off the same paths.
                  objective: '"Find the Bible passage and its text in the ESV translation: " + body.query'
                  searchQueries: '["site:biblegateway.com ESV " + body.query]'
                  mode: fast
                  maxResults: 5
                  maxCharsTotal: 6000

          - name: search_bronze_age_pervert
            description: >
              Look something up in Bronze Age Pervert's Substack — his own
              writing on vitality, beauty, exercise and the shape of a life
              worth living. Use it when the person has named him or that
              current as something they read, not to introduce him — and not
              when they are low enough that being told to be harder would land
              as a rebuke.
            inputSchema: |
              {
                "type": "object",
                "required": ["query"],
                "properties": { "query": { "type": "string" } }
              }
            process:
              - type: parallel-search
                name: bap
                settings:
                  connector: research
                  objective: '"Find what Bronze Age Pervert has written about this on his Substack: " + body.query'
                  searchQueries: '["site:bronzeagepervert.substack.com " + body.query]'
                  mode: fast
                  maxResults: 5
                  maxCharsTotal: 6000
        default:
          process:
            - type: set-payload
              name: guardrail-answer
              settings:
                value: '{"answer": "That is not something I can help with here."}'
