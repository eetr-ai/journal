# Hello world. One HTTP endpoint so there is something to curl while the rest of
# the stack comes up.
service:
  name: journal

env:
  - name: HTTP_PORT
    default: "8080"

connectors:
  - name: api
    type: http
    settings:
      port: ${HTTP_PORT}

flows:
  - name: hello
    source:
      connector: api
      type: http
      settings:
        path: /hello
    process:
      - type: set-payload
        name: greeting
        settings:
          value: '{"message": "hello world"}'
