# Hello world. A cron tick and a log line, so the editor has something to open
# and `task agent:invoke -- greet` has something to run.
service:
  name: journal

connectors:
  - name: ticker
    type: cron

flows:
  - name: greet
    source:
      connector: ticker
      type: cron
      settings:
        # Six fields, seconds first: fire on second 0 of every minute.
        schedule: "0 * * * * *"
        # CEL, evaluated at fire time with `now` bound to the moment it fired.
        payload: '{"date": string(now)}'
    process:
      - type: log
        name: greeter
        settings:
          level: info
          message: '"journal agent is alive, the date is " + body.date'
