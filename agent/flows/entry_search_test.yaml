cases:
  # The whole shape of the thing, in one case: sealed in, opened for the model,
  # sealed back out with one line of plaintext beside it.
  - name: the shortlist is opened for the model and sealed again on the way back
    input:
      data:
        query: what happened to the knee
        key: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE=
        locale: es
      vars: { method: POST, subject: dolphin-entries-chunks }
    mocks:
      entry-search.anything-to-rank[else].rank-hits:
        cases:
          - when: "true"
            body:
              results:
                - id: aaaaaaaa-0000-4000-8000-000000000011
                  why: Se te fue la rodilla en las escaleras.
    expect:
      that:
        - body.results.size() == 1
        - body.results[0].why == "Se te fue la rodilla en las escaleras."
        # What the browser gets is what the drawer already knows how to open.
        - body.results[0].entry.title.startsWith("enc1:")
        - body.results[0].entry.content.startsWith("enc1:")
        - body.results[0].entry.id == "aaaaaaaa-0000-4000-8000-000000000011"
        # Every field the browser builds an entry from, or a kept day comes back
        # looking unkept.
        - has(body.results[0].entry.bookmarked)
        - body.results[0].entry.bookmarked == false
    spies:
      entry-search.anything-to-rank[else].rank-hits:
        records:
          - input:
              that:
                # Opened here, and only here. A model handed ciphertext would
                # rank it by nothing at all.
                - body.question == "what happened to the knee"
                - body.entries[0].title == "A day in two halves"
                # The whole day, not the paragraph that matched: a model shown
                # one paragraph answers about that paragraph.
                - body.entries[0].text.contains("Ran the loop again before work.")
                - body.entries[0].text.contains("Then the knee went at the top of the stairs.")
                # One row per entry, not one per chunk — DISTINCT ON is what
                # keeps a three-part day from filling the shortlist itself.
                - body.entries.size() == 2
                # Named by the caller, never guessed from the entry.
                - body.answerIn == "es"

  - name: an id the model invented is dropped rather than answered with a hole
    input:
      data:
        query: what happened to the knee
        key: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE=
        locale: es
      vars: { method: POST, subject: dolphin-entries-chunks }
    mocks:
      entry-search.anything-to-rank[else].rank-hits:
        cases:
          - when: "true"
            body:
              results:
                - id: ffffffff-0000-4000-8000-00000000fake
                  why: A day that was never written.
                - id: aaaaaaaa-0000-4000-8000-000000000012
                  why: Un dia tranquilo.
    expect:
      that:
        - body.results.size() == 1
        - body.results[0].entry.id == "aaaaaaaa-0000-4000-8000-000000000012"

  # Nothing to rank is an ordinary answer, and no model call to pay for.
  - name: a person with nothing written gets an empty answer and no model call
    input:
      data:
        query: anything at all
        key: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE=
        locale: es
      vars: { method: POST, subject: dolphin-vault-absent }
    expect:
      body:
        results: []
    spies:
      entry-search.anything-to-rank[else].rank-hits:
        count: 0

  # The case that matters most. Somebody else's entry sits exactly on this
  # question — closer than anything the searcher owns — so a statement that
  # stopped scoping by subject would rank it first rather than miss it quietly.
  - name: another person's entry is not on the shortlist, however well it matches
    input:
      data:
        query: what happened to the knee
        key: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE=
        locale: es
      vars: { method: POST, subject: dolphin-entries-chunks }
    mocks:
      entry-search.anything-to-rank[else].rank-hits:
        cases:
          - when: "true"
            body:
              results: []
    expect:
      body:
        results: []
    spies:
      entry-search.anything-to-rank[else].rank-hits:
        records:
          - input:
              that:
                - body.entries.exists(e, e.id == "bbbbbbbb-0000-4000-8000-000000000001") == false
                - body.entries.size() == 2

  # The schema does not require the ranked ids to be distinct, and a day cannot
  # be two results.
  - name: an id the model named twice is answered once
    input:
      data:
        query: what happened to my knee
        key: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE=
        locale: es
      vars: { method: POST, subject: dolphin-entries-chunks }
    mocks:
      entry-search.anything-to-rank[else].rank-hits:
        cases:
          - when: "true"
            body:
              results:
                - id: aaaaaaaa-0000-4000-8000-000000000011
                  why: La primera vez.
                - id: aaaaaaaa-0000-4000-8000-000000000012
                  why: Otro dia.
                - id: aaaaaaaa-0000-4000-8000-000000000011
                  why: Y otra vez la misma.
    expect:
      that:
        - body.results.size() == 2
        # Kept where it was first put, not where it was repeated.
        - body.results[0].entry.id == "aaaaaaaa-0000-4000-8000-000000000011"
        - body.results[0].why == "La primera vez."
        - body.results[1].entry.id == "aaaaaaaa-0000-4000-8000-000000000012"

  # A caller that can reach the agent port is not always the BFF.
  - name: a shortlist longer than the cap is cut down to it
    input:
      data:
        query: what happened to my knee
        key: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE=
        locale: es
        limit: 500
      vars: { method: POST, subject: dolphin-entries-chunks }
    mocks:
      entry-search.anything-to-rank[else].rank-hits:
        cases:
          - when: "true"
            body:
              results: []
    expect:
      body:
        results: []
    spies:
      entry-search.search-chunks:
        records:
          - input:
              that:
                - vars.shortlist == 20
