cases:
  - name: everyone is ranked by their closest line, and named with it
    input:
      data: { query: who bakes bread }
      vars: { subject: dolphin-people-search, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        # No word of it is written anywhere, so meaning is all there is.
        - body.people == []
        - body.related.map(r, r.name) == ["Marta", "Mónica", "Nico"]
        - body.related[0].because == "Bakes sourdough every Sunday."
        - body.related[1].because == "Runs the Tuesday meeting."
        - body.related[2].because == "Nico, my brother"
        - body.related[0].distance < body.related[1].distance
        - body.related[0].id == "eeeeeeee-0000-4000-8000-000000000301"
    spies:
      people-find.by-meaning[then].rank-if-we-can[process].embed-circle:
        records:
          - input:
              that:
                # Opened before it goes out, the query first.
                - vars.corpus.map(c, c.text) == ["Marta, my friend", "Bakes sourdough every Sunday.", "Mónica, my boss", "Runs the Tuesday meeting.", "Nico, my brother"]
                - vars.query == "who bakes bread"

  - name: a word match and the ranking answer side by side
    input:
      data: { query: MONICA }
      vars: { subject: dolphin-people-search, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        # Mónica as written, found unaccented.
        - body.people.map(p, p.name) == ["Mónica"]
        - body.people[0].facts == []
        - size(body.related) == 3

  - name: without a query nothing is embedded
    input:
      data: {}
      vars: { subject: dolphin-people-search, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      that:
        - body.people.map(p, p.name) == ["Marta", "Mónica", "Nico"]
        - body.related == []
    spies:
      people-find.by-meaning[then].rank-if-we-can[process].embed-circle:
        count: 0

  - name: nobody to rank is nothing embedded
    input:
      data: { query: anyone }
      vars: { subject: dolphin-nobody-here, dataKey: ZG9scGhpbi1lbnRyaWVzLWZpeHR1cmUta2V5LTMyYiE= }
    expect:
      body:
        people: []
        related: []
    spies:
      people-find.by-meaning[then].rank-if-we-can[process].embed-circle:
        count: 0
