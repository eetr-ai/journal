# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  # chill rather than assertive: we want the review to flag what actually
  # matters on a PR and stay quiet about taste, which is the only way a bot
  # review stays worth reading on a repo this size.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: true
  auto_review:
    enabled: true
    drafts: false
    # release-please owns these branches and the diffs are generated. There is
    # nothing on them a review can improve.
    ignore_title_keywords:
      - 'chore(main): release'

chat:
  auto_reply: true
